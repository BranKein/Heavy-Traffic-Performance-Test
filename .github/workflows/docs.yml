name: docs

# main 에 문서 관련 변경이 올라가면 빌드해서 GitHub Pages 로 배포한다.
# 사전 준비(최초 1회): Settings → Pages → Build and deployment → Source = "GitHub Actions"
# 커스텀 도메인도 같은 화면에서 지정한다(Actions 배포 방식에서는 CNAME 파일 불필요).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# 배포에 필요한 최소 권한만 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 새 푸시가 들어오면 진행 중인 배포는 취소하지 않고 순서대로 처리
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: 의존성 설치
        run: pip install -r requirements-docs.txt

      # --strict: 깨진 내부 링크나 nav 에만 있고 실제로 없는 문서를 빌드 실패로 잡는다
      - name: 사이트 빌드
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

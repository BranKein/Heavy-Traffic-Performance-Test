<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 1 58 44" width="58" height="44" role="img" aria-label="채팅 푸시 팬아웃">
  <!--
    프로젝트 마크: 채팅 한 건(말풍선)이 여러 기기로 팬아웃되는 모습.
    헤더에서 24px 정도로 줄어들므로 요소를 셋으로만 제한하고 획을 굵게 잡았다.
    색은 velog 그린(#12B886) — 흰 배경과 #121212 다크 배경 양쪽에서 대비가 나온다.

    viewBox 는 0 0 64 64 가 아니라 그림의 실제 경계(x 8~62, y 4~43)에 맞춰 조였다.
    Material 은 로고를 정사각(1.2rem × 1.2rem) 박스에 넣기 때문에, 아래위 빈 여백을
    남겨두면 그만큼 마크가 작게 렌더링된다.
  -->
  <g fill="none" stroke="#12b886" stroke-width="4.5" stroke-linecap="round">
    <path d="M34 24 L48 13" />
    <path d="M34 24 L50 24" />
    <path d="M34 24 L48 35" />
  </g>

  <g fill="#12b886">
    <!-- 팬아웃 대상 기기 -->
    <circle cx="53" cy="11" r="6" />
    <circle cx="56" cy="24" r="6" />
    <circle cx="53" cy="37" r="6" />

    <!-- 말풍선 (꼬리 포함) -->
    <path d="M14 4 H30 A6 6 0 0 1 36 10 V26 A6 6 0 0 1 30 32 H24 L14 41 V32 A6 6 0 0 1 8 26 V10 A6 6 0 0 1 14 4 Z" />
  </g>
</svg>

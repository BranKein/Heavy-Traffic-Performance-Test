<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="채팅 푸시 팬아웃">
  <!--
    파비콘은 브라우저 탭에서 16px 로 줄어든다. 그 크기에서 알아볼 수 있는 형태는
    사실상 하나뿐이라, 로고의 팬아웃 가지는 빼고 말풍선 실루엣만 남겼다.
    (팬아웃까지 넣으면 16px 에서 두 요소가 붙어 형체가 뭉개진다.)
    안쪽 점 세 개는 32px 이상에서만 인지되는 디테일 — 뭉개져도 실루엣은 유지된다.
  -->
  <rect width="64" height="64" rx="14" fill="#12b886" />

  <path
    fill="#ffffff"
    d="M20 14 H44 A8 8 0 0 1 52 22 V34 A8 8 0 0 1 44 42 H32 L20 51 V42 A8 8 0 0 1 12 34 V22 A8 8 0 0 1 20 14 Z" />

  <g fill="#12b886">
    <circle cx="24" cy="28" r="3.5" />
    <circle cx="32" cy="28" r="3.5" />
    <circle cx="40" cy="28" r="3.5" />
  </g>
</svg>

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.5'
}

group = 'me.yeonhyuk.heavy_traffic'
version = '0.0.1-SNAPSHOT'
description = 'spring_webflux_jooq'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT (RS256 / RSA-2048) — SR §4
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // jOOQ 코드 생성기(DDLDatabase)를 codegen 태스크 classpath 에 제공
    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-r2dbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// jOOQ 코드 생성 — Flyway 마이그레이션 DDL 로부터 타입 생성 (라이브 DB 불필요)
// ---------------------------------------------------------------------------
jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/migration/V1__init_schema.sql'
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                    property {
                        key = 'parseDialect'
                        value = 'POSTGRES'
                    }
                }
            }
            generate {
                javaTimeTypes = true
                deprecated = false
                records = true
                fluentSetters = true
            }
            target {
                packageName = 'me.yeonhyuk.heavy_traffic.spring_webflux_jooq.jooq'
                directory = "${projectDir}/build/generated-src/jooq"
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "${projectDir}/build/generated-src/jooq"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

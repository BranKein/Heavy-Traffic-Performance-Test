spring:
  application:
    name: spring_mvc_jpa
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # 스키마는 perf 시드(seed/schema.sql)가 앱 기동 전에 생성한다(ddl-auto=validate).
  # 여러 앱이 같은 DB 에 동시 마이그레이션하다 오염되는 문제를 피하려 마이그레이션 툴은 두지 않는다.


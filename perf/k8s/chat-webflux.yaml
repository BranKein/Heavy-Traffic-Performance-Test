# Better Chatting Push Server (Spring WebFlux + jOOQ). 구현 완료 후 이미지 import 하면 동작.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-webflux
  labels: { app: chat-webflux, role: sut }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-webflux }
  template:
    metadata:
      labels: { app: chat-webflux, role: sut }
    spec:
      # sut 노드에만 스케줄 (agent 노드 taint role=sut:NoSchedule 와 세트)
      nodeSelector: { role: sut }
      tolerations:
        - { key: role, operator: Equal, value: sut, effect: NoSchedule }
      containers:
        - name: chat-webflux
          image: chat-webflux
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: SPRING_R2DBC_URL, value: r2dbc:postgresql://postgres:5432/chat_server }
            - { name: SPRING_R2DBC_USERNAME, value: chat }
            - { name: SPRING_R2DBC_PASSWORD, value: chat1234 }
            # webflux 의 PushProperties 필드명은 baseUrl(=push.base-url) — 다른 서버들의
            # PUSH_SERVERURL(=push.server-url) 로는 바인딩되지 않아 push 호출이 즉시 실패하고
            # 흡수돼(500ms 지연 없이) 응답이 나가버리는 버그가 있었다. 반드시 PUSH_BASEURL 사용.
            - { name: PUSH_BASEURL, value: http://fake-push-server:8090 }
            - name: JWT_PUBLICKEY
              valueFrom:
                secretKeyRef: { name: jwt-public-key, key: public-key }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "1", memory: 2Gi }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-webflux
spec:
  selector: { app: chat-webflux }
  ports:
    - port: 8080
      targetPort: 8080

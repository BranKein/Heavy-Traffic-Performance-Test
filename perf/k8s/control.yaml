# 마스터 컨트롤 패널 — 부하 테스트 대상 조회 / k6 Job 시작·중지 / 지표 조회.
# 클러스터 내부에서 kubectl(in-cluster)로 perf 네임스페이스를 제어하며 NodePort 30800 으로 노출.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perf-control
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perf-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perf-control
subjects:
  - kind: ServiceAccount
    name: perf-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-control
  labels: { app: perf-control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: perf-control }
  template:
    metadata:
      labels: { app: perf-control }
    spec:
      serviceAccountName: perf-control
      containers:
        - name: control
          image: perf-control          # tag 는 kustomization.images 에서 주입
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - { name: PERF_ORCH, value: k8s }
            - { name: NAMESPACE, value: perf }
            - { name: PROM_URL, value: "http://prometheus:9090" }
            - { name: GRAFANA_PORT, value: "30300" }
            # 실행 기록/결과/시계열 영속화 — 공유 postgres(perf 네임스페이스)의 control 스키마
            - { name: PGHOST, value: postgres }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: chat_server }
            - { name: PGUSER, value: chat }
            - { name: PGPASSWORD, value: chat1234 }
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "250m", memory: 128Mi }
          readinessProbe:
            httpGet: { path: /api/config, port: 8088 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: perf-control
spec:
  type: NodePort
  selector: { app: perf-control }
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30800   # http://<노드IP>:30800 로 접속

# Fake Push Server 단독 부하 테스트 Job. 랜덤 UUID 만 사용하므로 시드 불필요.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-push
  namespace: perf
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args:
            - run
            - -o
            - experimental-prometheus-rw
            - /scripts/push_test.js
          env:
            - { name: BASE_URL, value: "http://fake-push-server:8090" }
            - { name: PROFILE, value: "load" }
            - { name: TARGET_NAME, value: "push" }
            - { name: K6_PROMETHEUS_RW_SERVER_URL, value: "http://prometheus:9090/api/v1/write" }
            - { name: K6_PROMETHEUS_RW_TREND_STATS, value: "p(95),p(99),avg,min,max" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
            items:
              - { key: push_test.js, path: push_test.js }
              - { key: options.js, path: lib/options.js }

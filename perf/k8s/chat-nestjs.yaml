apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-nestjs
  labels: { app: chat-nestjs, role: sut }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-nestjs }
  template:
    metadata:
      labels: { app: chat-nestjs, role: sut }
    spec:
      # sut 노드에만 스케줄 (agent 노드 taint role=sut:NoSchedule 와 세트)
      nodeSelector: { role: sut }
      tolerations:
        - { key: role, operator: Equal, value: sut, effect: NoSchedule }
      containers:
        - name: chat-nestjs
          image: chat-nestjs            # tag 는 kustomization.images 에서 주입
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
            - { name: DATABASE_URL, value: postgres://chat:chat1234@postgres:5432/chat_server }
            - { name: PUSH_SERVER_URL, value: http://fake-push-server:8090 }
            - { name: RUN_MIGRATIONS, value: "true" }   # drizzle: CREATE TABLE IF NOT EXISTS (안전)
            - { name: LOG_DIR, value: /app/logs }
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: jwt-public-key, key: public-key }
          # 테스트 대상 리소스 제한 (SR §10: vCPU 1 / RAM 2GB)
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "1", memory: 2Gi }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-nestjs
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: { app: chat-nestjs }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-push-server
spec:
  # 스케일 아웃: fake-push 가 SUT 의 push fan-out(목표 20,000 req/s @ 0.5s 지연)을 감당하도록 복제.
  # 무상태(PushCounter 는 인스턴스별·비필수)라 수평 복제가 안전하다.
  replicas: 5
  selector:
    matchLabels: { app: fake-push-server }
  template:
    metadata:
      labels: { app: fake-push-server }
    spec:
      # deps 노드에만 스케줄 (agent 노드 taint role=deps:NoSchedule 와 세트)
      nodeSelector: { role: deps }
      tolerations:
        - { key: role, operator: Equal, value: deps, effect: NoSchedule }
      containers:
        - name: fake-push-server
          image: yeonhyukkim/fake-push-server:latest
          ports:
            - containerPort: 8090
          # SUT 와 동일 스케일(limits vCPU 1 / RAM 2GB, SR §10). requests 는 SUT 컨벤션(500m)과
          # 맞춰 5 replica 도 스케줄 가능하게 둔다("replica N 개 ≈ N배" 해석의 상한은 limits 로 고정).
          resources:
            requests: { cpu: "500m", memory: 128Mi }
            limits: { cpu: "1", memory: 2Gi }
          # SUT 와 동일 컨벤션: 부팅 게이팅 startupProbe + 트래픽 게이팅 readinessProbe.
          # (fake-push 는 actuator 없이 8090 만 열므로 tcpSocket 사용)
          startupProbe:
            tcpSocket: { port: 8090 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8090 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fake-push-server
spec:
  # ClusterIP + 기본 sessionAffinity=None → 커넥션 단위로 replica 들에 분산.
  # (SUT 의 커넥션 풀이 replica 수보다 훨씬 커야 고르게 퍼진다 — SUT 풀 확대와 세트로 동작)
  selector: { app: fake-push-server }
  ports:
    - port: 8090
      targetPort: 8090
